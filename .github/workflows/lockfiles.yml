name: Create lockfiles

# One-time helper. Lockfiles pin every package version so builds are repeatable.
# This workflow creates them and opens a pull request. Merge it, and CI uses them from then on.
# (If the pull request cannot be opened, allow it under Settings > Actions > General > Workflow permissions,
# or open a pull request from the branch it pushes.)
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve the packages
        run: |
          (cd server && npm install --package-lock-only --ignore-scripts)
          (cd web && npm install --package-lock-only --ignore-scripts)

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "Lockfiles are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b chore/lockfiles
          git add server/package-lock.json web/package-lock.json
          git commit -m "Add package lockfiles"
          git push --force origin chore/lockfiles
          gh pr create --base "$BASE" --head chore/lockfiles \
            --title "Add package lockfiles" \
            --body "Pins every package version so builds are repeatable. Generated by the Create lockfiles workflow." \
            || echo "Branch chore/lockfiles was pushed. Open a pull request from it on GitHub."
