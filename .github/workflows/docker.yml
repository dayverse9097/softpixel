name: Container images

# Builds the server image (and the tools image used for migrations), scans it, and pushes it to GitHub's
# container registry (ghcr.io) from main. The Deploy workflow calls this one, so a release always has fresh images.
on:
  push:
    branches: [main]
    paths:
      - server/**
      - .github/workflows/docker.yml
  pull_request:
    paths:
      - server/**
      - .github/workflows/docker.yml
  workflow_call:

permissions:
  contents: read

jobs:
  image:
    name: Image (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: nexplay-server
            target: runtime
          - image: nexplay-server-tools
            target: tools
    steps:
      - uses: actions/checkout@v4

      - name: Work out the image name (lower case, as the registry requires)
        id: name
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "repo=ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.name.outputs.repo }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (nothing is pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: server
          target: ${{ matrix.target }}
          load: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Scan the production image for known vulnerabilities
        if: matrix.target == 'runtime'
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: server
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          provenance: true
          sbom: true
