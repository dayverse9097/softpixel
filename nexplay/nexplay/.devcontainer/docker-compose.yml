# Development environment for GitHub Codespaces and VS Code dev containers: Node 22 plus a throwaway Postgres.
services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:1-22-bookworm
    volumes:
      - ..:/workspaces/${localWorkspaceFolderBasename}:cached
    command: sleep infinity
    depends_on:
      - db
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexplay_migrator
      POSTGRES_PASSWORD: dev-only-change-me
      POSTGRES_DB: nexplay
    volumes:
      - db-data:/var/lib/postgresql/data
volumes:
  db-data:
