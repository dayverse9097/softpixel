# Local development database only. The password below is for a throwaway container; never reuse it.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: nexplay_migrator
      POSTGRES_PASSWORD: dev-only-change-me
      POSTGRES_DB: nexplay
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - nexplay-db:/var/lib/postgresql/data
volumes:
  nexplay-db:
